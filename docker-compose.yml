# Phase 0 (MIGRATION_PLAN.md) stood this up as today's single server plus
# placeholder Postgres/Redis containers. Phase 1 (externalizing state
# stores) wired both up for real: PostgresUserRepository and the three
# Redis-backed lookup-index stores both exist and are reachable via
# KUNGFUCHESS_POSTGRES_URL/KUNGFUCHESS_REDIS_URL.
#
# Phase 2 (splitting off the API Gateway) is the point where Postgres stops
# being merely "reachable but unused": `wsgateway` and `apigateway` below are
# now two separate containers that both read/write the `users` table, so
# KUNGFUCHESS_POSTGRES_URL is set on BOTH here, pointing at the same
# `postgres` service -- leaving either one on its own default SQLite file
# would let the two processes silently diverge on who's registered (see
# ARCHITECTURE.md's Known gaps). Both also share the same
# KUNGFUCHESS_TOKEN_SECRET, since apigateway issues login tokens and
# wsgateway only verifies them -- they must agree on the signing secret.
x-kungfuchess-shared-env: &kungfuchess-shared-env
  KUNGFUCHESS_POSTGRES_URL: postgresql://kungfuchess:kungfuchess@postgres:5432/kungfuchess
  KUNGFUCHESS_TOKEN_SECRET: change-me-to-a-real-secret-before-any-real-deployment

# Phase 3 (splitting the WebSocket Gateway from the Game Node), reshaped by
# Phase 4b (splitting the Game Node itself into a singleton Game Allocator
# plus one-or-more Game Server Shards): every service below now talks to the
# others exclusively over Redis pub/sub (see server/src/services/
# GameNodeBridge/), and `wsgateway`'s/`gameallocator`'s/every `gamenode-*`'s
# state stores must be the SAME Redis-backed stores for any of them to see
# each other's state at all -- unlike Phase 1's KUNGFUCHESS_REDIS_URL (an
# opt-in there), this is mandatory for all of them now; see
# gameallocator/src/main.cpp, gamenode/src/main.cpp, and
# server/src/main.cpp's file comments for what happens if it's unset.
x-kungfuchess-redis-env: &kungfuchess-redis-env
  KUNGFUCHESS_REDIS_URL: tcp://redis:6379

services:
  # MIGRATION_PLAN.md Phase 3: renamed from `server`/KungFuChessServer -- this
  # is now a thin relay holding client connections, no game logic of its own.
  wsgateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-wsgateway
    environment:
      <<: [*kungfuchess-shared-env, *kungfuchess-redis-env]
    ports:
      - "9002:9002" # game WebSocket
      - "9003:9003" # health check (GET /health)
    volumes:
      - kungfuchess-data:/app/data
    depends_on:
      - postgres
      - redis
      - gameallocator
      - gamenode-1
      - gamenode-2

  # MIGRATION_PLAN.md Phase 4b: Matchmaker/MatchmakingRequestHandler/
  # GameAllocator, split off from what used to be the single `gamenode`
  # process -- see ARCHITECTURE.md for the full design. Exactly one replica
  # of this service ever runs (unlike `gamenode-*` below): a second Matchmaker
  # instance racing the first over the same Redis-backed queue is exactly the
  # split-brain Phase 1 externalized the queue store to make survivable, not
  # something to actually run twice. No client-facing port of its own, just
  # its own health check.
  gameallocator:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-gameallocator
    environment:
      <<: *kungfuchess-redis-env
    ports:
      - "9006:9006" # health check (GET /health)
    depends_on:
      - redis

  # MIGRATION_PLAN.md Phase 3: one shard's GameSessionManager/GameSession's
  # tick loop -- see ARCHITECTURE.md for the full design. No client-facing
  # port of its own (all client traffic still enters through `wsgateway`),
  # just its own health check. Phase 4b: this is now one of potentially
  # several named shard services, each with a distinct KUNGFUCHESS_SHARD_ID
  # -- `gamenode-1`/`gamenode-2` below are two concurrently-running shards
  # (Phase 4's exit criteria), each just a copy of the same block with a
  # different shard id and host health-check port (Compose's own `--scale`
  # can't inject a distinct env var per replica, which is why these are
  # separate named services instead of one scaled service). Add a
  # `gamenode-3` etc. the same way if more capacity is ever needed.
  gamenode-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-gamenode
    environment:
      <<: [*kungfuchess-shared-env, *kungfuchess-redis-env]
      KUNGFUCHESS_SHARD_ID: shard-1
    ports:
      - "9005:9005" # health check (GET /health)
    depends_on:
      - postgres
      - redis

  gamenode-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-gamenode
    environment:
      <<: [*kungfuchess-shared-env, *kungfuchess-redis-env]
      KUNGFUCHESS_SHARD_ID: shard-2
    ports:
      - "9007:9005" # health check (GET /health) -- 9005 is gamenode-1's, remapped here
    depends_on:
      - postgres
      - redis

  # MIGRATION_PLAN.md Phase 2: register/login as their own deployable HTTP
  # service, reusing the same Postgres-backed user store as `wsgateway` (see
  # the shared env anchor above) -- see ARCHITECTURE.md for the full design.
  apigateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-apigateway
    environment:
      <<: *kungfuchess-shared-env
    ports:
      - "9004:9004" # register/login REST API
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kungfuchess
      POSTGRES_PASSWORD: kungfuchess
      POSTGRES_DB: kungfuchess
    volumes:
      - kungfuchess-postgres:/var/lib/postgresql/data

  # MIGRATION_PLAN.md Phase 1 introduced RedisConnectionStore/
  # RedisMatchQueueStore/RedisSessionIndexStore as an opt-in; Phase 3 above is
  # the point this stops being a placeholder -- `wsgateway`/`gamenode` both
  # require it now (see the redis env anchor above).
  redis:
    image: redis:7-alpine

volumes:
  kungfuchess-data:
  kungfuchess-postgres:

# Phase 0 (MIGRATION_PLAN.md) stood this up as today's single server plus
# placeholder Postgres/Redis containers. Phase 1 (externalizing state
# stores) has since wired both up for real: PostgresUserRepository and the
# three Redis-backed lookup-index stores both exist and are reachable via
# KUNGFUCHESS_POSTGRES_URL/KUNGFUCHESS_REDIS_URL on the `server` service --
# but neither is set here, so SQLite + local/in-memory storage remain the
# actual defaults until a staging run proves each backend out.
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9002:9002" # game WebSocket
      - "9003:9003" # health check (GET /health)
    volumes:
      - kungfuchess-data:/app/data

  # PostgresUserRepository (MIGRATION_PLAN.md Phase 1) exists now, but SQLite
  # stays the server's actual default -- see server/src/main.cpp. Set
  # KUNGFUCHESS_POSTGRES_URL on the `server` service (not done here by
  # default) to opt this deployment into Postgres, e.g.
  # postgresql://kungfuchess:kungfuchess@postgres:5432/kungfuchess.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kungfuchess
      POSTGRES_PASSWORD: kungfuchess
      POSTGRES_DB: kungfuchess
    volumes:
      - kungfuchess-postgres:/var/lib/postgresql/data

  # RedisConnectionStore/RedisMatchQueueStore/RedisSessionIndexStore
  # (MIGRATION_PLAN.md Phase 1) exist now, but local/in-memory storage stays
  # the server's actual default -- see server/src/main.cpp. Set
  # KUNGFUCHESS_REDIS_URL on the `server` service (not done here by default)
  # to opt this deployment's ConnectionRegistry/Matchmaker/GameSessionManager
  # lookup indexes into Redis all at once, e.g. tcp://redis:6379.
  redis:
    image: redis:7-alpine

volumes:
  kungfuchess-data:
  kungfuchess-postgres:
